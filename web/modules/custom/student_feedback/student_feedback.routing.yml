student_feedback.form:
  path: '/feedback'
  defaults:
    _form: '\Drupal\student_feedback\Form\ContentForm'
    _title: 'Submit Feedback'
  requirements:
    _permission: 'access content'

student_feedback.edit:
  path: '/feedback/edit/{feedbackId}'
  defaults:
    _form: '\Drupal\student_feedback\Form\ContentForm'
    _title: 'Edit Feedback'
  requirements:
    _permission: 'access content'

student_feedback.delete:
  path: '/feedback/delete/{feedbackId}'
  defaults:
    _controller: '\Drupal\student_feedback\Controller\FeedbackController::deleteFeedback'
  requirements:
    _permission: 'access content'

student_feedback.settings:
  path: '/admin/config/student-feedback'
  defaults:
    _form: '\Drupal\student_feedback\Form\ConfigForm'
    _title: 'Settings'
  requirements:
    _permission: 'administer site configuration'

student_feedback.list:
  path: '/admin/feedback'
  defaults:
    _controller: '\Drupal\student_feedback\Controller\FeedbackController::listFeedback'
    _title: 'Feedback List'
  requirements:
    _permission: 'access content'